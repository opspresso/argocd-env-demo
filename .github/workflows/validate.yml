name: validate

# On demand only. The build on main renders and validates the same way before values are pushed, so
# pull requests do not start a second validation.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install -r requirements/runtime.txt -r requirements/dev.txt

      - name: Build values
        run: bash scripts/build.sh
        env:
          GITHUB_PUSH: "false"

      - name: Validate charts
        run: python3 scripts/validate.py --all-charts

      - name: Test
        run: python3 -m pytest
