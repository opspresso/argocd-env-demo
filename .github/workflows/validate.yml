name: validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: pip install -r requirements.txt

      - name: Install Helm 📝
        uses: azure/setup-helm@v4

      # Renders first so the check covers what build.sh will commit, not the
      # values files a pull request happens to have left stale.
      - name: Render 🏗️
        run: bash ./build.sh

      - name: Validate 🧪
        run: python3 ./validate.py
