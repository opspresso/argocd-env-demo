name: build

on:
  push:
    branches:
      - main

concurrency:
  group: gitops
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: pip install -r requirements/runtime.txt -r requirements/dev.txt

      - name: Build, Validate, Test and Push 🚀
        run: |
          bash ./scripts/build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PUSH: "true"
