name: build

# Renders and validates chart values before Argo CD syncs them. A GitOps deploy commit changes only
# the phase version files, which the render does not read, so such a commit does not start a build.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "charts/*/values-alpha.yaml"
      - "charts/*/values-prod.yaml"
      - "charts/*/versions-*.json"

concurrency:
  group: gitops
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python 🐍
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: pip install -r requirements/runtime.txt -r requirements/dev.txt

      - name: Build, Validate, Test and Push 🚀
        run: |
          bash ./scripts/build.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PUSH: "true"
