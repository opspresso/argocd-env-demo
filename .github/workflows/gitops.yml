name: gitops

on:
  repository_dispatch:
    types:
      - gitops

# Deploys serialize: every non-prod phase pushes to main, so overlapping runs
# would race. Never cancel one - a cancelled deploy leaves a half-written chart.
concurrency:
  group: gitops
  cancel-in-progress: false

jobs:
  gitops:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          # Persists as the credential for git push, so no token ends up in a
          # remote URL. A PAT (not GITHUB_TOKEN) so the push triggers workflows.
          token: ${{ secrets.GHP_TOKEN }}

      - name: Setup Python 🐍
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies 📦
        run: pip install -r requirements.txt

      - name: GitOps 🚚
        env:
          GITHUB_TOKEN: ${{ secrets.GHP_TOKEN }}
          GH_TOKEN: ${{ secrets.GHP_TOKEN }}
          TG_USERNAME: ${{ github.event.client_payload.username }}
          TG_PROJECT: ${{ github.event.client_payload.project }}
          TG_VERSION: ${{ github.event.client_payload.version }}
          TG_CONTAINER: ${{ github.event.client_payload.container }}
          TG_ACTION: ${{ github.event.client_payload.action }}
          TG_PHASE: ${{ github.event.client_payload.phase }}
          TG_TYPE: ${{ github.event.client_payload.type }}
        run: |
          bash ./gitops.sh
