cluster: k3s-demo

country: kr
env: k3s
metrics:
  backend: victoria-metrics
phase: alpha
group: k3s-demo
role: k3s

replicas: 1
autoscaling: false
agent_studio_maintenance: false
resources: false

aws_account_id: "396608815058"
aws_region: ap-northeast-2

hostname:
  internal: demo-in.opsp.dev
  public: demo.opsp.dev

agent_studio:
  service:
    key: agentops
    name: 'Axleon AgentOps'
    logo: agentops
  hostname: studio.opsp.dev
  allowed_hosts:
    - studio.opsp.dev
    - studio.agrt.dev

agent_memory:
  hostname: memory.opsp.dev

audio_worker: true
workspace_worker: true
workspace_backend: kubernetes
workspace_legacy_docker: true
workspace_max_pods: 2
workspace_docker_image: public.ecr.aws/docker/library/docker:27.5.1-dind
workspace_network: agent-studio-public
workspace_memory_mb: 1024
workspace_disk_mb: 2048
workspace_cpus: 1
workspace_worker_concurrency: 1

postgresql:
  storage: 5Gi
minio:
  storage: 10Gi
neo4j:
  storage: 5Gi
