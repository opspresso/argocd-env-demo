cluster: eks-demo

country: kr
env: eks
metrics:
  backend: prometheus
phase: prod
role: mgmt

replicas: 1
autoscaling: true
resources: true

aws_account_id: "396608815058"
aws_region: ap-northeast-2

hostname:
  internal: demo-in.opspresso.com
  public: demo.opspresso.com
  this: demo-0.opspresso.com

agent_studio:
  hostname: studio.opspresso.com

agent_memory:
  hostname: memory.opspresso.com

audio_worker: true
workspace_worker: true
workspace_image: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio:workspace-v0.115.1
workspace_docker_image: public.ecr.aws/docker/library/docker:27.5.1-dind
workspace_network: none
workspace_memory_mb: 1024
workspace_disk_mb: 2048
workspace_cpus: 1
workspace_worker_concurrency: 1
workspace_storage: 20Gi
workspace_storage_class: gp3

postgresql:
  storage: 20Gi
  storageClass: gp3
neo4j:
  storage: 20Gi
  config:
    server.memory.heap.initial_size: 512m
    server.memory.heap.max_size: 512m
    server.memory.pagecache.size: 512m
