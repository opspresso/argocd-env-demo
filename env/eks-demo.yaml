cluster: eks-demo
country: kr
env: eks
metrics:
  backend: prometheus
phase: prod
group: eks-demo
role: mgmt
replicas: 1
autoscaling: true
agent_studio_maintenance: true
agent_memory_maintenance: true
resources: true
trusted_proxy_cidrs:
- 10.10.0.0/16
grafana_url: http://grafana.addon-grafana.svc.cluster.local
aws_account_id: '396608815058'
aws_region: ap-northeast-2
hostname:
  internal: demo-in.opspresso.com
  public: demo.opspresso.com
  this: demo-0.opspresso.com
agent_studio:
  service:
    key: agentops
    name: Axleon AgentOps
    logo: agentops
  hostname: studio.agrt.dev
  allowed_hosts:
  - studio.agrt.dev
agent_memory:
  hostname: memory.agrt.dev
  allowed_hosts:
  - memory.agrt.dev
audio_worker: true
workspace_worker: true
workspace_max_pods: 32
workspace_memory_mb: 2048
workspace_disk_mb: 2048
workspace_cpus: 1
workspace_worker_replicas: 2
workspace_worker_concurrency: 16
workspace_continuation_concurrency: 2
workspace_storage: 48Gi
workspace_storage_class: gp3
postgresql:
  max_connections: 400
  storage: 20Gi
  storageClass: gp3
neo4j:
  offline_maintenance: true
  storage: 20Gi
  config:
    server.memory.heap.initial_size: 512m
    server.memory.heap.max_size: 512m
    server.memory.pagecache.size: 512m
agent_librio:
  hostname: librio.agrt.dev
  allowed_hosts:
  - librio.agrt.dev
agent_forge:
  hostname: forge.agrt.dev
  allowed_hosts:
  - forge.agrt.dev
agent_librio_maintenance: true
agent_forge_maintenance: true
