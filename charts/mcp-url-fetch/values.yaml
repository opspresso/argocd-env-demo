# URL-fetch MCP server Agent Studio calls.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. Agent Studio
# reaches it at mcp-url-fetch.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agent-studio carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one fetch, so the chart
# defaults are right and a copied 660s grace period would only make every
# rollout eleven minutes long.

app:
  fullnameOverride: mcp-url-fetch

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-url-fetch

  service:
    name: http
    targetPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # A PDF parse holds the whole document in memory, so the limit above is the
  # real bound on a request — not the 10MB download cap, which is the input to it.

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true
