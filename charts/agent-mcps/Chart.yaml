apiVersion: v2
name: agent-mcps
description: MCP servers Agent Studio calls — one Deployment each, cluster-internal
type: application
version: v1.4.0
appVersion: v1.0.0

# One aliased `app` per server, the shape sample-jobs uses for its cronjobs. The
# alias is only the values key; the Service name comes from fullnameOverride,
# because that name is what Agent Studio registers and it must not move when an
# alias is renamed.
dependencies:
  - repository: https://opspresso.github.io/helm-charts
    name: app
    alias: url-fetch
    condition: url-fetch.enabled
    version: "v1.4.0"
  - repository: https://opspresso.github.io/helm-charts
    name: app
    alias: grafana
    condition: grafana.enabled
    version: "v1.4.0"
  - repository: https://opspresso.github.io/helm-charts
    name: app
    alias: memory
    condition: memory.enabled
    version: "v1.4.0"
  - repository: https://opspresso.github.io/helm-charts
    name: app
    alias: kubernetes
    condition: kubernetes.enabled
    version: "v1.4.0"
