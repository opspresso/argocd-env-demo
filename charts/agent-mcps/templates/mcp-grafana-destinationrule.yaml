{{- if .Values.grafana.enabled }}
# mcp-grafana is the one stateful server here: streamable-http sessions live in
# the pod's memory (calls without a valid Mcp-Session-Id get "Invalid session
# ID"), so every request of a session must land on the pod that created it.
# With one replica this rule changes nothing; it exists so that raising
# replicas is a one-line change instead of a source of randomly broken runs.
# No `tls` block on purpose — setting one would override auto-mTLS.
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: mcp-grafana
spec:
  host: mcp-grafana.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpHeaderName: mcp-session-id
{{- end }}
