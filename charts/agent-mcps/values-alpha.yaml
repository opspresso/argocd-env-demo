# Image tags, pinned by hand.
#
# agent-studio's equivalent file is generated — its release workflow sends a
# repository_dispatch that gen_values.py turns into a bump. Neither MCP server
# does that, so these move when someone edits them, which is also why they are
# pinned rather than :latest.

url-fetch:
  image:
    tag: v1.1.2

grafana:
  image:
    # Upstream tags carry no `v` prefix, unlike everything else in this repo.
    tag: "1.0.0"

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
    data:
      # A service account token, not GRAFANA_API_KEY — upstream deprecated the
      # latter. Create the parameter before syncing, or the pod stays pending on
      # a secret that never materialises.
      - key: /k8s/common/agent-mcps/grafana-service-account-token
        name: GRAFANA_SERVICE_ACCOUNT_TOKEN
