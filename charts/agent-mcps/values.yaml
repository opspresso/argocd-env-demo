# MCP servers Agent Studio calls.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. Agent Studio
# reaches them at <fullnameOverride>.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agent-studio carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one fetch or one Grafana
# query, so the chart defaults are right and a copied 660s grace period would
# only make every rollout eleven minutes long.

url-fetch:
  enabled: true
  fullnameOverride: mcp-url-fetch

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-url-fetch

  # No MCP_API_KEY. The server runs unauthenticated when the key is unset, which
  # is the intended mode here: nothing routes to this Service from outside, so a
  # shared secret every pod already reaches would add a thing to rotate without
  # adding a thing it protects against. It says so in its own startup log.
  # Setting a key here is what to do if this ever gains an ingress.

  service:
    name: http
    targetPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # A PDF parse holds the whole document in memory, so the limit above is the
  # real bound on a request — not the 10MB download cap, which is the input to it.

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true

grafana:
  enabled: true
  fullnameOverride: mcp-grafana

  image:
    repository: grafana/mcp-grafana

  # `--address 0.0.0.0:8000` is load-bearing. The default is localhost:8000,
  # which binds inside the pod's own namespace only — the Service would resolve,
  # connect, and hang forever on a listener no other pod can reach.
  #
  # `--allowed-hosts` is the other half of that change, and it is not optional.
  # The server validates the Host header against loopback variants of --address
  # by default (DNS-rebinding protection), so widening the bind address without
  # widening this answers 403 to everything that is not localhost — including the
  # kubelet probe, which is what put this in a restart loop the first time.
  #
  # Matching is exact, verified against the running image: an entry with the port
  # and one without are different values, and `mcp-grafana.agent-mcps` does not
  # match `mcp-grafana.agent-mcps.svc.cluster.local`. So every form a caller may
  # use is listed. The pod IP cannot be — it changes every restart, which is why
  # the probes below send a Host header instead.
  args:
    - "--transport"
    - "streamable-http"
    - "--address"
    - "0.0.0.0:8000"
    - "--allowed-hosts"
    - "mcp-grafana.agent-mcps.svc.cluster.local,mcp-grafana.agent-mcps.svc,mcp-grafana.agent-mcps,mcp-grafana,localhost:8000,localhost"

  service:
    name: http
    targetPort: 8000

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

  # kubelet sends the pod IP as the Host header, which the allowlist above cannot
  # contain because it changes on every restart. Naming one explicitly is what
  # lets the check stay on for real traffic.
  readinessProbe:
    httpGet:
      path: /healthz
      port: 8000
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /healthz
      port: 8000
      httpHeaders:
        - name: Host
          value: localhost
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true

memory:
  enabled: true
  fullnameOverride: mcp-memory

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-memory

  # No MCP_API_KEY, for the same reason url-fetch has none: nothing routes to
  # this Service from outside. The server says which mode it is in on every
  # start, so the day an ingress appears the open mode is in the logs.
  #
  # No AWS credentials either. The ServiceAccount below is bound to
  # pod-role--mcp-memory by an EKS Pod Identity association, defined in
  # terraform-env-demo/demo/6-role. Pod Identity needs no annotation on the
  # ServiceAccount — unlike IRSA — so the only requirement here is that the
  # account exists under exactly the name the association names.
  configmap:
    enabled: true
    data:
      AWS_REGION: ap-northeast-2
      # S3 Vectors. The index's dimension, distance metric and non-filterable
      # metadata keys are fixed at creation; see the repository's README before
      # pointing this at a different one.
      VECTOR_BUCKET: agent-studio-vector
      VECTOR_INDEX: memories
      # Ordinary S3: access counters and the recency index.
      STATE_BUCKET: agent-studio-memory
      # Bedrock needs no key — the pod role covers it — and runs in the same
      # region as the vector bucket. EMBEDDING_DIM must equal the index's.
      EMBEDDING_PROVIDER: bedrock
      EMBEDDING_MODEL: amazon.titan-embed-text-v2:0
      EMBEDDING_DIM: '1024'
      # The relevance floor, and the one setting that belongs to the embedding
      # model rather than to the server: calibrated against measured Titan
      # similarities, where a correct answer scores 0.15-0.41 and an unrelated
      # one under 0.05. Changing EMBEDDING_MODEL means recalibrating this.
      RECALL_MIN_SIMILARITY: '0.1'

  service:
    name: http
    targetPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  # Required, and not just conventional: the Pod Identity association names this
  # account, so the pod gets no AWS credentials at all without it.
  serviceAccount:
    create: true
