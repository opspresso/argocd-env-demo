apiVersion: v2
name: agentdure
description: Build AI agents that work together.
type: application
version: v1.3.0
appVersion: v1.0.0

dependencies:
  - repository: https://opspresso.github.io/helm-charts
    name: app
    version: "v1.4.0"
  # The schedule ticker: a CronJob POSTing the app's scan endpoint once a
  # minute. Aliased so its values sit under `scan:` beside `app:`.
  - repository: https://opspresso.github.io/helm-charts
    name: cronjob
    version: "v1.1.0"
    alias: scan
  # The capability reindex, hourly. A second CronJob rather than another curl
  # inside `scan`: that one ticks every minute because a schedule occurrence is
  # time-bound and missing its window loses it, while a reindex rebuilds from
  # the registries as they are now and has no window to miss. Per minute it
  # would only probe every MCP server sixty times an hour for nothing.
  - repository: https://opspresso.github.io/helm-charts
    name: cronjob
    version: "v1.1.0"
    alias: reindex
