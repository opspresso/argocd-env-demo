app:
  fullnameOverride: agent-studio

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio
    tag: latest

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # cpu: 200m
      memory: 512Mi

  service:
    name: http
    targetPort: 3000

  # Draining a pod takes up to the grace period below, so replacing pods one at a
  # time would stretch a rollout to that many multiples. Surging the whole new set
  # at once keeps a rollout to roughly a single drain, at the cost of briefly
  # running double the pods. maxUnavailable stays 0 — capacity never dips.
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 100%
        maxUnavailable: 0

  # Both probes use /api/health, which reports only "this process is serving".
  #
  # /api/ready additionally checks the LLM provider, which makes it wrong for a
  # readiness probe here: the provider is shared by every pod, so one provider
  # blip would mark the entire fleet unready at once and take down the console
  # along with it — even though the console, chats and dashboards do not need the
  # provider. It stays available for manual and ALB-style checks.
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

  # Liveness must not fail while a long run is in flight; /api/health answers
  # without touching PostgreSQL or the LLM channel, so a slow provider can never
  # restart a pod that is working.
  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

  # A run may hold its connection for MAX_RUN_DURATION_MS (600s), and Next.js
  # drains in-flight requests and `after()` work before exiting. The grace period
  # has to cover that, or every scale-down and rolling deploy cuts streams
  # mid-answer and drops the Slack events being processed in the background.
  #
  # The countdown starts before preStop runs, so the budget is
  # preStop (15s) + run (600s) + drain overhead — not the run alone. 660s matches
  # RUN_LEASE_SECONDS in the app, which is derived the same way.
  #
  # The cost is deliberate: terminating one pod takes up to ~11 minutes. Lower
  # this only together with MAX_RUN_DURATION_MS — the two are one decision.
  terminationGracePeriodSeconds: 660

  # SIGTERM makes Next.js stop accepting new connections immediately, while
  # removing the pod from Service endpoints propagates asynchronously. Without
  # this pause, requests routed during that window hit a closed listener and fail.
  lifecycle:
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 15"]

  # Runs are I/O bound — a pod saturated with in-flight runs sits at near-zero
  # CPU — so CPU utilization is not a usable scaling signal here. It would fail to
  # scale up under real load and would scale down pods that are busy streaming.
  # Scale on the in-flight run gauge the app exposes at /api/metrics instead.
  #
  # Requires prometheus-adapter to publish agent_studio_active_runs as a pods
  # metric. Until it does, the HPA reports FailedGetPodsMetric and holds the
  # replica count steady — it does not scale on anything else.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    metrics:
      - type: Pods
        pods:
          metric:
            name: agent_studio_active_runs
          target:
            type: AverageValue
            averageValue: "8"
    # Pods take minutes to terminate, so scaling down eagerly is expensive and
    # hard to undo. Scale up promptly, shed slowly.
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300

  serviceMonitor:
    enabled: true
    endpoints:
      - interval: 15s
        path: /api/metrics
        port: http

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  serviceAccount:
    create: true

  # Keeps replicas off a single node so one node's loss cannot take the service
  # with it — and, with the long grace period, cannot stall every in-flight run.
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname

  # maxUnavailable, not minAvailable: minAvailable equal to minReplicas would
  # leave no disruption budget at the floor and block node drains outright.
  # One pod at a time holds at every fleet size.
  pdb:
    enabled: true
    maxUnavailable: 1

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store

# The schedule ticker (agent-studio docs/OPERATIONS.md#schedule-ticker).
# Schedule triggers fire only when something POSTs /api/triggers/scan; this
# CronJob is that something. It holds no state and no cron knowledge — which
# occurrences are due and who wins each one is decided server-side with a
# conditional write per occurrence, so a duplicate, concurrent or late tick
# never double-fires. The token comes from the same external secret the app
# reads (SCHEDULE_SCAN_TOKEN, /k8s/common/agent-studio/schedule-scan-token).
#
# The same tick also nudges the plugins sync (/api/plugins/sync/scan): the
# server compares the repo head against its last report and answers upToDate
# without paying for a snapshot when nothing merged, so a merge to
# agent-plugins lands within a minute at one GitHub read per quiet tick.
scan:
  fullnameOverride: agent-studio-scan
  suspend: false
  # On maintenance resume, run at most the most recent missed minute. The
  # server's 10-minute schedule catch-up window is evaluated by that one tick.
  startingDeadlineSeconds: 60

  # Once a minute, matching the app's fixed 10-minute catch-up window: a few
  # missed ticks lose nothing, and an outage longer than the window is bounded
  # on purpose.
  schedule: "* * * * *"

  image:
    repository: curlimages/curl
    tag: "8.11.1"

  # -f turns an app-side refusal (401/503) into a failed Job, which is what
  # failedJobsHistoryLimit keeps visible.
  command:
    - /bin/sh
    - -c
    - >-
      curl -sf -X POST -H "x-scan-token: ${SCHEDULE_SCAN_TOKEN}"
      http://agent-studio/api/triggers/scan &&
      curl -sf -X POST -H "x-scan-token: ${SCHEDULE_SCAN_TOKEN}"
      http://agent-studio/api/plugins/sync/scan
  additionalSecret:
    enabled: true
    names:
      - agent-studio-external

  # A tick answers in seconds; one that outlives the next tick is stuck, and
  # the claim makes an overlapping replacement safe anyway.
  activeDeadlineSeconds: 55
  concurrencyPolicy: Forbid
  backoffLimit: 0
  restartPolicy: Never
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 600

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# The capability reindex (agent-studio docs/OPERATIONS.md#catalog-reindex).
# Rebuilds the global catalog — every skill, every MCP server and the tools it
# offers, every external agent — so a newly registered entry becomes
# discoverable without an admin doing anything.
#
# Hourly rather than per minute like the scan above, and the difference is the
# whole reason it is a second CronJob: a schedule occurrence is time-bound and
# a missed window loses it, while this rebuilds from the registries as they are
# now. A skipped run only delays discovery of what changed since the last one,
# and each run probes every registered MCP server — sixty times an hour would
# buy nothing. Ticking twice is safe: keys are derived from the entry, so a
# second pass writes the same records and computes the same leftovers.
#
# 503 means CATALOG_ENABLED is off, which -f turns into a failed Job. That is
# deliberate — a deployment carrying EMBEDDING_* but no catalog should be
# visible rather than quietly doing nothing.
reindex:
  fullnameOverride: agent-studio-reindex
  suspend: false
  # An hourly rebuild needs at most one late start after maintenance.
  startingDeadlineSeconds: 3600

  schedule: "12 * * * *"

  image:
    repository: curlimages/curl
    tag: "8.11.1"

  command:
    - /bin/sh
    - -c
    - >-
      curl -sf -X POST -H "x-scan-token: ${SCHEDULE_SCAN_TOKEN}"
      http://agent-studio/api/catalog/reindex

  additionalSecret:
    enabled: true
    names:
      - agent-studio-external

  # Bounds the request, not the reindex: the tick hands the work off and returns
  # in milliseconds, so the rebuild outlives this Job by design.
  activeDeadlineSeconds: 60
  concurrencyPolicy: Forbid
  backoffLimit: 0
  restartPolicy: Never
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 3600

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

# Workers reuse app.deployment. The composition adapter resolves overrides in
# parent scope so app.image remains the single GitOps image/version source.
audioWorker:
  enabled: false
  fullnameOverride: agent-studio-audio-worker
  controller:
    enabled: false
    strategy:
      rollingUpdate:
        maxSurge: 25%
        maxUnavailable: 25%
  service:
    enabled: false
  containerName: audio-worker
  serviceAccount:
    name: agent-studio
  terminationGracePeriodSeconds: 60
  command: [node, build/audio-worker.cjs]
  envFrom:
    - configMapRef:
        name: agent-studio
    - secretRef:
        name: agent-studio-external
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  overrides: |
    enabled: {{ .Values.audioWorker.enabled }}
    replicaCount: {{ if hasKey .Values.audioWorker "replicas" }}{{ .Values.audioWorker.replicas }}{{ else }}1{{ end }}
    image: {{ toYaml .Values.app.image | nindent 2 }}
    imagePullSecrets: {{ toYaml .Values.app.imagePullSecrets | nindent 2 }}
    podAnnotations:
      checksum/config: {{ toYaml .Values.app.configmap | sha256sum }}
    {{- if not .Values.app.resources }}
    resources: null
    {{- end }}

workspaceWorker:
  enabled: false
  fullnameOverride: agent-studio-workspace-worker
  controller:
    enabled: false
    strategy:
      type: Recreate
  service:
    enabled: false
  containerName: workspace-worker
  serviceAccount:
    name: agent-studio
  terminationGracePeriodSeconds: 60
  imagePullSecrets:
    - name: ecr-registry
  envFrom:
    - configMapRef:
        name: agent-studio
    - secretRef:
        name: agent-studio-external
    - configMapRef:
        name: agent-studio-workspace
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  readinessProbe:
    exec:
      command: [node, build/workspace-health.cjs, --worker]
    initialDelaySeconds: 20
    periodSeconds: 10
    timeoutSeconds: 15
  livenessProbe:
    exec:
      command: [node, build/workspace-health.cjs, --heartbeat-only]
    initialDelaySeconds: 60
    periodSeconds: 20
    timeoutSeconds: 15
  backend: docker
  # Keep the old PVC/daemon until an operator approves retirement after cutover.
  legacyDocker:
    enabled: true
  kubernetes:
    namespace: agent-studio-workspaces
    nodePool: ""
    maxPods: 8
    dnsCidrs: []
    allowPublic: true
    extraEgress: []
  registry:
    enabled: false
  persistence:
    # This PVC is managed by raw, independently of the worker Deployment.
    enabled: false
    size: 10Gi
    storageClass: local-path
  overrides: |
    enabled: {{ .Values.workspaceWorker.enabled }}
    replicaCount: {{ if hasKey .Values.workspaceWorker "replicas" }}{{ .Values.workspaceWorker.replicas }}{{ else }}1{{ end }}
    image: {{ toYaml .Values.app.image | nindent 2 }}
    automountServiceAccountToken: {{ eq .Values.workspaceWorker.backend "kubernetes" }}
    podAnnotations:
      checksum/config: {{ toYaml .Values.app.configmap | sha256sum }}
      checksum/workspace: {{ toYaml .Values.workspaceWorker.kubernetes | sha256sum }}
      checksum/network: {{ .Files.Get "files/workspace-network.sh" | sha256sum }}
    {{- if not .Values.app.resources }}
    resources: null
    {{- end }}
    {{- if eq .Values.workspaceWorker.backend "docker" }}
    command:
      - /bin/sh
      - -ec
      - |
        until test -f /workspace-network/ready && docker info >/dev/null 2>&1; do sleep 2; done
        docker image inspect "$WORKSPACE_IMAGE" >/dev/null 2>&1 || docker pull "$WORKSPACE_IMAGE"
        exec node build/workspace-worker.cjs
    env:
      - name: DOCKER_HOST
        value: tcp://127.0.0.1:2375
    extraVolumes:
    {{ toYaml .Values.workspaceDocker.extraVolumes | indent 2 }}
      - name: ecr-config
        secret:
          secretName: ecr-registry
          items:
            - key: .dockerconfigjson
              path: config.json
    extraVolumeMounts:
      - name: network-ready
        mountPath: /workspace-network
        readOnly: true
      - name: ecr-config
        mountPath: /home/app/.docker
        readOnly: true
    sidecars:
      - {{ tpl .Values.workspaceDocker.container $ | nindent 4 | trim }}
    {{- else }}
    command: [node, build/workspace-worker.cjs]
    {{- end }}

workspaceDocker:
  revisionHistoryLimit: 10
  fullnameOverride: agent-studio-workspace-docker
  controller:
    enabled: false
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
      # Wait until the worker releases its RWO data directory.
      argocd.argoproj.io/sync-wave: "1"
    strategy:
      type: Recreate
  service:
    enabled: false
  containerName: docker
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 60
  extraVolumes:
    - name: network-script
      configMap:
        name: agent-studio-workspace-network
    - name: network-ready
      emptyDir: {}
    - name: docker-data
      persistentVolumeClaim:
        claimName: agent-studio-workspace-docker
  container: |
    name: docker
    image: {{ .Values.workspaceWorker.dockerImage }}
    imagePullPolicy: IfNotPresent
    command: ["/bin/sh", "/opt/workspace-network/workspace-network.sh"]
    env:
      - name: DOCKER_TLS_CERTDIR
        value: ""
      - name: WORKSPACE_NETWORK
        value: {{ .Values.app.configmap.data.WORKSPACE_NETWORK | quote }}
    args: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
    securityContext:
      privileged: true
    volumeMounts:
      - name: network-script
        mountPath: /opt/workspace-network
        readOnly: true
      - name: network-ready
        mountPath: /workspace-network
      - name: docker-data
        mountPath: /var/lib/docker
    {{- if .Values.app.resources }}
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: 1000m
        memory: 1536Mi
    {{- end }}
    readinessProbe:
      exec:
        command: ["/bin/sh", "-ec", "test -f /workspace-network/ready && docker info >/dev/null 2>&1"]
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
    livenessProbe:
      exec:
        command: ["/bin/sh", "-ec", "test -f /workspace-network/ready && docker info >/dev/null 2>&1"]
      initialDelaySeconds: 30
      periodSeconds: 20
      timeoutSeconds: 5
  overrides: |
    enabled: {{ and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") .Values.workspaceWorker.legacyDocker.enabled }}
    replicaCount: {{ if hasKey .Values.workspaceWorker "replicas" }}{{ .Values.workspaceWorker.replicas }}{{ else }}1{{ end }}
    {{- $container := tpl .Values.workspaceDocker.container $ | fromYaml }}
    {{- if hasKey $container "Error" }}{{ fail (index $container "Error") }}{{ end }}
    image:
      reference: {{ .Values.workspaceWorker.dockerImage | quote }}
    command: {{ toYaml $container.command | nindent 2 }}
    args: {{ toYaml $container.args | nindent 2 }}
    env: {{ toYaml $container.env | nindent 2 }}
    securityContext: {{ toYaml $container.securityContext | nindent 2 }}
    extraVolumeMounts: {{ toYaml $container.volumeMounts | nindent 2 }}
    readinessProbe: {{ toYaml $container.readinessProbe | nindent 2 }}
    livenessProbe: {{ toYaml $container.livenessProbe | nindent 2 }}
    resources: {{ toYaml $container.resources | nindent 2 }}
    podAnnotations:
      checksum/network: {{ .Files.Get "files/workspace-network.sh" | sha256sum }}

raw:
  # Evaluated by composition.yaml in parent scope, then rendered by incubator/raw.
  parentTemplates:
    - |
        {{- if .Values.workspaceWorker.enabled }}
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: agent-studio-workspace
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
        data:
          WORKSPACE_PROVIDER: {{ .Values.workspaceWorker.backend | quote }}
        {{- if eq .Values.workspaceWorker.backend "kubernetes" }}
          WORKSPACE_NAMESPACE: {{ .Values.workspaceWorker.kubernetes.namespace | quote }}
          WORKSPACE_INSTANCE: {{ .Release.Name | quote }}
          WORKSPACE_LEGACY_DOCKER: {{ .Values.workspaceWorker.legacyDocker.enabled | quote }}
          WORKSPACE_IMAGE_PULL_SECRET: ecr-registry
        {{- if .Values.workspaceWorker.kubernetes.nodePool }}
          WORKSPACE_NODE_POOL: {{ .Values.workspaceWorker.kubernetes.nodePool | quote }}
        {{- end }}
        {{- end }}
          WORKSPACE_IMAGE: {{ printf "%s:workspace-%s" .Values.app.image.repository .Values.app.image.tag | quote }}
        {{- end }}
    - |
        {{- if .Values.workspaceWorker.enabled }}
        apiVersion: v1
        kind: ConfigMap
        metadata:
          name: agent-studio-workspace-network
        data:
          workspace-network.sh: |
        {{ .Files.Get "files/workspace-network.sh" | indent 4 }}
        {{- end }}
    - |
        {{- if .Values.workspaceWorker.enabled }}
        apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: agent-studio-workspace-docker
          annotations:
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
            helm.sh/resource-policy: keep
          labels:
            app.kubernetes.io/name: agent-studio-workspace-worker
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          accessModes: ["ReadWriteOnce"]
          storageClassName: {{ .Values.workspaceWorker.persistence.storageClass }}
          resources:
            requests:
              storage: {{ .Values.workspaceWorker.persistence.size }}
        ---
        {{- if or (eq .Values.workspaceWorker.backend "docker") .Values.workspaceWorker.legacyDocker.enabled }}
        apiVersion: v1
        kind: Service
        metadata:
          name: agent-studio-workspace-docker
          labels:
            app.kubernetes.io/name: agent-studio-workspace-worker
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          type: ClusterIP
          # Drain checks must reach the daemon even if its worker is unhealthy or pulling an image.
          publishNotReadyAddresses: true
          selector:
            app.kubernetes.io/name: {{ if eq .Values.workspaceWorker.backend "kubernetes" }}agent-studio-workspace-docker{{ else }}agent-studio-workspace-worker{{ end }}
            app.kubernetes.io/instance: {{ .Release.Name }}
          ports:
            # Docker exec hijacks HTTP with Upgrade: tcp; HTTP sniffing proxies reject it.
            - name: tcp-docker
              port: 2375
              targetPort: 2375
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: agent-studio-workspace-docker
          labels:
            app.kubernetes.io/name: agent-studio-workspace-worker
            app.kubernetes.io/instance: {{ .Release.Name }}
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ if eq .Values.workspaceWorker.backend "kubernetes" }}agent-studio-workspace-docker{{ else }}agent-studio-workspace-worker{{ end }}
              app.kubernetes.io/instance: {{ .Release.Name }}
          policyTypes: [Ingress]
          ingress:
            - from:
                - podSelector:
                    matchExpressions:
                      - key: app.kubernetes.io/name
                        operator: In
                        values: [agent-studio, agent-studio-workspace-worker, agent-studio-workspace-migration]
              ports:
                - protocol: TCP
                  port: 2375
        ---
        {{- end }}
        {{- end }}
    - |
        {{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") }}
        {{- $ns := .Values.workspaceWorker.kubernetes.namespace }}
        apiVersion: v1
        kind: Namespace
        metadata:
          name: {{ $ns }}
          annotations:
            argocd.argoproj.io/sync-wave: "-3"
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
          labels:
            pod-security.kubernetes.io/enforce: baseline
            sidecar.istio.io/inject: "false"
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: sandbox
          namespace: {{ $ns }}
        automountServiceAccountToken: false
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: agent-studio-sandbox
          namespace: {{ $ns }}
        rules:
          - apiGroups: [""]
            resources: [pods]
            verbs: [get, list, create, delete]
          - apiGroups: [""]
            resources: [pods/exec]
            verbs: [get, create]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: agent-studio-sandbox
          namespace: {{ $ns }}
        subjects:
          - kind: ServiceAccount
            name: agent-studio
            namespace: {{ .Release.Namespace }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: agent-studio-sandbox
        ---
        apiVersion: v1
        kind: ResourceQuota
        metadata:
          name: agent-studio-sandbox
          namespace: {{ $ns }}
        spec:
          hard:
            pods: {{ .Values.workspaceWorker.kubernetes.maxPods | quote }}
            requests.cpu: {{ mulf .Values.workspaceWorker.cpus .Values.workspaceWorker.kubernetes.maxPods | quote }}
            limits.cpu: {{ mulf .Values.workspaceWorker.cpus .Values.workspaceWorker.kubernetes.maxPods | quote }}
            requests.memory: {{ printf "%dMi" (mul .Values.workspaceWorker.memoryMb .Values.workspaceWorker.kubernetes.maxPods) | quote }}
            limits.memory: {{ printf "%dMi" (mul .Values.workspaceWorker.memoryMb .Values.workspaceWorker.kubernetes.maxPods) | quote }}
            requests.ephemeral-storage: {{ printf "%dMi" (mul (add (mul .Values.workspaceWorker.diskMb 2) 512) .Values.workspaceWorker.kubernetes.maxPods) | quote }}
            limits.ephemeral-storage: {{ printf "%dMi" (mul (add (mul .Values.workspaceWorker.diskMb 2) 512) .Values.workspaceWorker.kubernetes.maxPods) | quote }}
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: sandbox-isolation
          namespace: {{ $ns }}
        spec:
          podSelector: {}
          policyTypes: [Ingress, Egress]
          ingress: []
          egress: []
        ---
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: sandbox-egress
          namespace: {{ $ns }}
        spec:
          podSelector:
            matchLabels:
              app.kubernetes.io/name: agent-studio-sandbox
          policyTypes: [Egress]
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
        {{- range .Values.workspaceWorker.kubernetes.dnsCidrs }}
                - ipBlock:
                    cidr: {{ . | quote }}
        {{- end }}
              ports:
                - {protocol: UDP, port: 53}
                - {protocol: TCP, port: 53}
        {{- if .Values.workspaceWorker.kubernetes.allowPublic }}
            # Both deployed clusters use IPv4; policy CIDRs must match the cluster IP family.
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4]
              ports:
                - {protocol: TCP, port: 80}
                - {protocol: TCP, port: 443}
        {{- end }}
        {{- with .Values.workspaceWorker.kubernetes.extraEgress }}
        {{ toYaml . | indent 4 }}
        {{- end }}
        {{- end }}
    - |
        {{- if and .Values.workspaceWorker.enabled .Values.workspaceWorker.registry.enabled }}
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ECRAuthorizationToken
        metadata:
          name: agent-studio-workspace-ecr
          annotations:
            argocd.argoproj.io/sync-wave: "-2"
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          region: {{ .Values.workspaceWorker.registry.region }}
        ---
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ecr-registry
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          refreshInterval: 1h
          target:
            name: ecr-registry
            template:
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: |
                  {"auths":{"{{`{{ .proxy_endpoint }}`}}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}","auth":"{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}}}
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ECRAuthorizationToken
                  name: agent-studio-workspace-ecr
        {{- end }}
    - |
        {{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") }}
        apiVersion: generators.external-secrets.io/v1alpha1
        kind: ECRAuthorizationToken
        metadata:
          name: agent-studio-sandbox-ecr
          namespace: {{ .Values.workspaceWorker.kubernetes.namespace }}
          annotations:
            argocd.argoproj.io/sync-wave: "-2"
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          region: {{ .Values.workspaceWorker.registry.region }}
        ---
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: ecr-registry
          namespace: {{ .Values.workspaceWorker.kubernetes.namespace }}
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
            argocd.argoproj.io/sync-options: Prune=false,Delete=false
        spec:
          refreshInterval: 1h
          target:
            name: ecr-registry
            template:
              type: kubernetes.io/dockerconfigjson
              data:
                .dockerconfigjson: |
                  {"auths":{"{{`{{ .proxy_endpoint }}`}}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}","auth":"{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}}}
          dataFrom:
            - sourceRef:
                generatorRef:
                  apiVersion: generators.external-secrets.io/v1alpha1
                  kind: ECRAuthorizationToken
                  name: agent-studio-sandbox-ecr
        {{- end }}
    - |
        {{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") }}
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: agent-studio-workspace-migration
          annotations:
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/sync-wave: "-3"
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: agent-studio-workspace-migration
          annotations:
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/sync-wave: "-3"
        rules:
          - apiGroups: [""]
            resources: [pods]
            verbs: [get, list]
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: agent-studio-workspace-migration
          annotations:
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/sync-wave: "-3"
        subjects:
          - kind: ServiceAccount
            name: agent-studio-workspace-migration
            namespace: {{ .Release.Namespace }}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: agent-studio-workspace-migration
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: agent-studio-workspace-migration
          annotations:
            argocd.argoproj.io/hook: PreSync
            argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
        spec:
          backoffLimit: 0
          activeDeadlineSeconds: 120
          template:
            metadata:
              annotations:
                sidecar.istio.io/inject: "false"
              labels:
                # Existing DinD policy already allows app Pods; omit instance to avoid selecting this Job into the app Service.
                app.kubernetes.io/name: agent-studio
            spec:
              serviceAccountName: agent-studio-workspace-migration
              restartPolicy: Never
              imagePullSecrets:
                - name: ecr-registry
              containers:
                - name: migration
                  image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}
                  command: [node, build/workspace-migration-check.cjs]
                  env:
                    - {name: WORKSPACE_CONTROL_NAMESPACE, value: {{ .Release.Namespace | quote }}}
                    - {name: WORKSPACE_INSTANCE, value: {{ .Release.Name | quote }}}
                    - {name: DOCKER_HOST, value: "tcp://agent-studio-workspace-docker.{{ .Release.Namespace }}.svc.cluster.local:2375"}
        {{- if .Values.app.resources }}
                  resources:
                    requests: {cpu: 100m, memory: 128Mi}
                    limits: {cpu: 500m, memory: 256Mi}
        {{- end }}
        {{- end }}
