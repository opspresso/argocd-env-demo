{{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") }}
apiVersion: generators.external-secrets.io/v1alpha1
kind: ECRAuthorizationToken
metadata:
  name: agent-studio-sandbox-ecr
  namespace: {{ .Values.workspaceWorker.kubernetes.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  region: {{ .Values.workspaceWorker.registry.region }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ecr-registry
  namespace: {{ .Values.workspaceWorker.kubernetes.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  refreshInterval: 1h
  target:
    name: ecr-registry
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |
          {"auths":{"{{`{{ .proxy_endpoint }}`}}":{"username":"{{`{{ .username }}`}}","password":"{{`{{ .password }}`}}","auth":"{{`{{ printf "%s:%s" .username .password | b64enc }}`}}"}}}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ECRAuthorizationToken
          name: agent-studio-sandbox-ecr
{{- end }}
