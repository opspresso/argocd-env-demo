{{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-studio-workspace-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-studio-workspace-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-studio-workspace-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-3"
subjects:
  - kind: ServiceAccount
    name: agent-studio-workspace-migration
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-studio-workspace-migration
---
apiVersion: batch/v1
kind: Job
metadata:
  name: agent-studio-workspace-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        # Existing DinD policy already allows app Pods; omit instance to avoid selecting this Job into the app Service.
        app.kubernetes.io/name: agent-studio
    spec:
      serviceAccountName: agent-studio-workspace-migration
      restartPolicy: Never
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: migration
          image: {{ .Values.app.image.repository }}:{{ .Values.app.image.tag }}
          command: [node, build/workspace-migration-check.cjs]
          env:
            - {name: WORKSPACE_CONTROL_NAMESPACE, value: {{ .Release.Namespace | quote }}}
            - {name: WORKSPACE_INSTANCE, value: {{ .Release.Name | quote }}}
            - {name: DOCKER_HOST, value: "tcp://agent-studio-workspace-docker.{{ .Release.Namespace }}.svc.cluster.local:2375"}
{{- if .Values.app.resources }}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
{{- end }}
{{- end }}
