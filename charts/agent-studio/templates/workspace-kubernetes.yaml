{{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") }}
{{- $ns := .Values.workspaceWorker.kubernetes.namespace }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    pod-security.kubernetes.io/enforce: baseline
    sidecar.istio.io/inject: "false"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sandbox
  namespace: {{ $ns }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-studio-sandbox
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, create, delete]
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [get, create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-studio-sandbox
  namespace: {{ $ns }}
subjects:
  - kind: ServiceAccount
    name: agent-studio
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-studio-sandbox
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: agent-studio-sandbox
  namespace: {{ $ns }}
spec:
  hard:
    pods: {{ .Values.workspaceWorker.kubernetes.maxPods | quote }}
    requests.cpu: {{ mulf .Values.workspaceWorker.cpus .Values.workspaceWorker.kubernetes.maxPods | quote }}
    limits.cpu: {{ mulf .Values.workspaceWorker.cpus .Values.workspaceWorker.kubernetes.maxPods | quote }}
    requests.memory: {{ printf "%dMi" (mul .Values.workspaceWorker.memoryMb .Values.workspaceWorker.kubernetes.maxPods) | quote }}
    limits.memory: {{ printf "%dMi" (mul .Values.workspaceWorker.memoryMb .Values.workspaceWorker.kubernetes.maxPods) | quote }}
    requests.ephemeral-storage: {{ printf "%dMi" (mul (add (mul .Values.workspaceWorker.diskMb 2) 512) .Values.workspaceWorker.kubernetes.maxPods) | quote }}
    limits.ephemeral-storage: {{ printf "%dMi" (mul (add (mul .Values.workspaceWorker.diskMb 2) 512) .Values.workspaceWorker.kubernetes.maxPods) | quote }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-isolation
  namespace: {{ $ns }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  ingress: []
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sandbox-egress
  namespace: {{ $ns }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-studio-sandbox
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
{{- range .Values.workspaceWorker.kubernetes.dnsCidrs }}
        - ipBlock:
            cidr: {{ . | quote }}
{{- end }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
{{- if .Values.workspaceWorker.kubernetes.allowPublic }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: [0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4]
        - ipBlock:
            cidr: "::/0"
            except: ["::/128", "::1/128", "64:ff9b::/96", "64:ff9b:1::/48", "100::/64", "2001:db8::/32", "fc00::/7", "fe80::/10", "ff00::/8"]
      ports:
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
{{- end }}
{{- with .Values.workspaceWorker.kubernetes.extraEgress }}
{{ toYaml . | indent 4 }}
{{- end }}
{{- end }}
