{{- if and .Values.workspaceWorker.enabled (eq .Values.workspaceWorker.backend "kubernetes") .Values.workspaceWorker.legacyDocker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-studio-workspace-docker
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # The old worker must release the RWO data directory before another daemon opens it.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: {{ if hasKey .Values.workspaceWorker "replicas" }}{{ .Values.workspaceWorker.replicas }}{{ else }}1{{ end }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-studio-workspace-docker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-studio-workspace-docker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      volumes:
        - name: network-script
          configMap:
            name: agent-studio-workspace-network
        - name: network-ready
          emptyDir: {}
        - name: docker-data
          persistentVolumeClaim:
            claimName: agent-studio-workspace-docker
      containers:
        - name: docker
          image: {{ .Values.workspaceWorker.dockerImage }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/workspace-network/workspace-network.sh"]
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
            - name: WORKSPACE_NETWORK
              value: {{ .Values.app.configmap.data.WORKSPACE_NETWORK | quote }}
          args: ["--host=tcp://0.0.0.0:2375", "--host=unix:///var/run/docker.sock"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: network-script
              mountPath: /opt/workspace-network
              readOnly: true
            - name: network-ready
              mountPath: /workspace-network
            - name: docker-data
              mountPath: /var/lib/docker
{{- if .Values.app.resources }}
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
{{- end }}
          readinessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -f /workspace-network/ready && docker info >/dev/null 2>&1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-ec", "test -f /workspace-network/ready && docker info >/dev/null 2>&1"]
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
{{- end }}
