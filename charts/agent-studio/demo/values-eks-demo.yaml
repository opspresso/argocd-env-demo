app:
  configmap:
    enabled: true
    data:
      STAGE: 'prod'
      ADMIN_EMAILS: me@nalbam.com
      ALLOWED_EMAIL_DOMAINS: nalbam.com
      AWS_REGION: ap-northeast-2
      BETTER_AUTH_URL: https://agent-studio.demo.opspresso.com
      # Capability catalog. Same S3 Vectors bucket mcp-memory writes to, its own
      # index — an index fixes its dimension and metric at creation, so the two
      # cannot share one. Created out of band: nothing in terraform-env-demo
      # manages s3vectors resources.
      CATALOG_INDEX: capabilities
      VECTOR_BUCKET: agent-studio-vector
      DYNAMODB_TABLE_NAME: agent-studio
      # Cohere rather than mcp-memory's Titan, and the reason is measured: a
      # Korean query against an English description scores 0.39 here and 0.065
      # on Titan, where unrelated pairs score 0.04 — so this registry is
      # unreachable from a Korean request under Titan. The two indexes are
      # separate, so they may differ; what must not differ is the model that
      # wrote an index and the one that queries it. Reached through its
      # inference profile: the bare model id refuses on-demand invocation.
      # No key — pod-role--agent-studio carries bedrock:InvokeModel.
      EMBEDDING_PROVIDER: cohere
      EMBEDDING_MODEL: global.cohere.embed-v4:0
      EMBEDDING_DIM: '1024'
      # Belongs to the embedding model, not to the search. Cohere scores
      # everything higher than Titan — unrelated pairs land at 0.24 where Titan
      # put them at 0.04 — so the floor is 0.25 rather than 0.15. Re-measure
      # when EMBEDDING_MODEL changes.
      CATALOG_MIN_SCORE: '0.25'
      LLM_BASE_URL: https://api.openai.com/v1
      LLM_PROVIDER_ANTHROPIC_BASE_URL: https://api.anthropic.com/v1
      LLM_PROVIDER_OPENAI_BASE_URL: https://api.openai.com/v1
      LLM_PROVIDER_XAI_BASE_URL: https://api.x.ai/v1
      MAX_RUN_DURATION_MS: '600000'
      MCP_INTERNAL_HOST_SUFFIXES: agent-mcps.svc.cluster.local
      PLUGINS_REPO: opspresso/agent-plugins
      PUBLIC_BASE_URL: https://agent-studio.demo.opspresso.com
      S3_BUCKET_NAME: agent-studio-static
      SLACK_LOADING_INDICATOR: ':loading:'
      TRUSTED_PROXY_CIDRS: 10.10.0.0/16
  routing:
    hosts:
    - agent-studio.demo.opspresso.com
    - agentpresso.dev
    httpRoute:
      enabled: true
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://agent-studio.demo.opspresso.com

  serviceMonitor:
    labels:
      release: prometheus-eks-demo