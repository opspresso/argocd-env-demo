app:
  configmap:
    enabled: true
    data:
      STAGE: 'prod'
      ADMIN_EMAILS: me@nalbam.com
      # ALLOWED_EMAIL_DOMAINS: nalbam.com
      AWS_REGION: ap-northeast-2
      BETTER_AUTH_URL: https://studio.opspresso.com
      PUBLIC_BASE_URL: https://studio.opspresso.com
      # Capability catalog. This is the prod environment, so every name here is
      # the `agent-studio-prod-*` set; the IDC host is alpha and reads the
      # `agent-studio-*` one. The two share no storage — a project made on one
      # is invisible on the other (agent-studio repo docs/OPERATIONS.md).
      # The prod set is named but not created yet: terraform-env-demo's
      # demo/9-agent-studio carries it as a commented env, so until that is
      # applied this deployment has no table to reach.
      #
      # The bucket holds mcp-memory's index too, but a separate one: an index
      # fixes its dimension and metric at creation, so the two cannot share one.
      CATALOG_INDEX: capabilities
      VECTOR_BUCKET: agent-studio-prod-vector
      DYNAMODB_TABLE_NAME: agent-studio-prod
      # Cohere rather than mcp-memory's Titan, and the reason is measured: a
      # Korean query against an English description scores 0.39 here and 0.065
      # on Titan, where unrelated pairs score 0.04 — so this registry is
      # unreachable from a Korean request under Titan. The two indexes are
      # separate, so they may differ; what must not differ is the model that
      # wrote an index and the one that queries it. Reached through its
      # inference profile: the bare model id refuses on-demand invocation.
      # No key — pod-role--agent-studio carries bedrock:InvokeModel.
      EMBEDDING_PROVIDER: cohere
      EMBEDDING_MODEL: global.cohere.embed-v4:0
      EMBEDDING_DIM: '1024'
      # Belongs to the embedding model, not to the search. Cohere scores
      # everything higher than Titan — unrelated pairs land at 0.24 where Titan
      # put them at 0.04 — so the floor is 0.25 rather than 0.15. Re-measure
      # when EMBEDDING_MODEL changes.
      CATALOG_MIN_SCORE: '0.25'
      LLM_BASE_URL: https://api.openai.com/v1
      UNKNOWN_MODEL_POLICY: allow
      LLM_PROVIDER_ANTHROPIC_BASE_URL: https://api.anthropic.com/v1
      LLM_PROVIDER_OPENAI_BASE_URL: https://api.openai.com/v1
      LLM_PROVIDER_GOOGLE_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      LLM_PROVIDER_XAI_BASE_URL: https://api.x.ai/v1
      LLM_PROVIDER_BEDROCK_BASE_URL: https://bedrock-mantle.us-east-1.api.aws/v1
      LLM_PROVIDER_BEDROCK_AUTH: sigv4
      LLM_PROVIDER_OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      MAX_RUN_DURATION_MS: '600000'
      MCP_INTERNAL_HOST_SUFFIXES: agent-mcps.svc.cluster.local
      PLUGINS_REPO: opspresso/agent-plugins
      PLUGINS_REPO_BRANCH: main
      S3_BUCKET_NAME: agent-studio-prod-static
      SLACK_LOADING_INDICATOR: ':loading:'
      TRUSTED_PROXY_CIDRS: 10.10.0.0/16
  routing:
    hosts:
    - agent-studio.demo.opspresso.com
    - studio.opspresso.com
    httpRoute:
      enabled: true
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://studio.opspresso.com

  serviceMonitor:
    labels:
      release: prometheus-eks-demo-b