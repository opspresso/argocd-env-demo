app:
  replicaCount: 1
  autoscaling:
    enabled: False
  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio

  imagePullSecrets:
    - name: ecr-registry
  extraVolumes:
    - name: ecr-config
      secret:
        secretName: ecr-registry
        items:
          - key: .dockerconfigjson
            path: config.json
  extraVolumeMounts:
    - name: ecr-config
      mountPath: /home/app/.docker
      readOnly: true


  configmap:
    enabled: true
    data:
      STAGE: 'prod'
      ADMIN_EMAILS: me@nalbam.com
      # ALLOWED_EMAIL_DOMAINS: nalbam.com
      AWS_REGION: ap-northeast-2
      BETTER_AUTH_URL: https://studio.demo.opsp.dev
      PUBLIC_BASE_URL: https://studio.demo.opsp.dev
      # Storage since agent-studio v0.87: one PostgreSQL (DATABASE_URL, from
      # the external secret /k8s/common/agent-studio/database-url — an RDS or
      # an in-cluster Postgres with pgvector; neither exists for prod yet) and
      # an S3-compatible bucket for artifacts, served through the app
      # (ARTIFACT_ACCESS_MODE=proxied) so the bucket needs no public policy.
      # The capability catalog lives in the database; CATALOG_ENABLED turns it
      # on. This is the prod environment; the IDC host is alpha and the two
      # share no storage — a project made on one is invisible on the other
      # (agent-studio repo docs/OPERATIONS.md).
      S3_BUCKET_NAME: agent-studio-static

      S3_ENDPOINT: http://minio.agent-studio.svc.cluster.local:9000
      S3_ACCESS_KEY_ID: agent-studio

      ARTIFACT_ACCESS_MODE: proxied
      CATALOG_ENABLED: 'true'
      SLACK_LOADING_INDICATOR: ':loading:'
      TRUSTED_PROXY_CIDRS: 10.10.0.0/16
      # Cohere rather than mcp-memory's Titan, and the reason is measured: a
      # Korean query against an English description scores 0.39 here and 0.065
      # on Titan, where unrelated pairs score 0.04 — so this registry is
      # unreachable from a Korean request under Titan. The two indexes are
      # separate, so they may differ; what must not differ is the model that
      # wrote an index and the one that queries it. Reached through its
      # inference profile: the bare model id refuses on-demand invocation.
      # No key — pod-role--agent-studio carries bedrock:InvokeModel.
      EMBEDDING_PROVIDER: cohere
      EMBEDDING_MODEL: global.cohere.embed-v4:0
      EMBEDDING_DIM: '1024'
      # Belongs to the embedding model, not to the search. Cohere scores
      # everything higher than Titan — unrelated pairs land at 0.24 where Titan
      # put them at 0.04 — so the floor is 0.25 rather than 0.15. Re-measure
      # when EMBEDDING_MODEL changes.
      CATALOG_MIN_SCORE: '0.25'
      LLM_BASE_URL: https://api.openai.com/v1
      UNKNOWN_MODEL_POLICY: allow
      LLM_PROVIDER_ANTHROPIC_BASE_URL: https://api.anthropic.com/v1
      LLM_PROVIDER_OPENAI_BASE_URL: https://api.openai.com/v1
      LLM_PROVIDER_GOOGLE_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai
      LLM_PROVIDER_XAI_BASE_URL: https://api.x.ai/v1
      LLM_PROVIDER_BEDROCK_BASE_URL: https://bedrock-mantle.us-east-1.api.aws/v1
      LLM_PROVIDER_BEDROCK_AUTH: sigv4
      LLM_PROVIDER_OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      MAX_RUN_DURATION_MS: '600000'
      MCP_INTERNAL_HOST_SUFFIXES: agent-mcps.svc.cluster.local
      PLUGINS_REPO: opspresso/agent-plugins
      PLUGINS_REPO_BRANCH: main
      WORKSPACE_IMAGE: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio:workspace-v0.113.5
      DOCKER_HOST: tcp://agent-studio-workspace-docker.agent-studio.svc.cluster.local:2375
      WORKSPACE_NETWORK: none
      WORKSPACE_MEMORY_MB: '1024'
      WORKSPACE_DISK_MB: '2048'
      WORKSPACE_CPUS: '1'
      WORKSPACE_WORKER_CONCURRENCY: '1'
  routing:
    hosts:
    - studio.demo.opsp.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://studio.demo.opsp.dev

  serviceMonitor:
    labels:
      release: prometheus-k3s-demo


  externalSecrets:
    enabled: true
    data:
    - key: /k8s/common/agent-studio/better-auth-secret
      name: BETTER_AUTH_SECRET
    - key: /k8s/common/agent-studio/google-client-id
      name: GOOGLE_CLIENT_ID
    - key: /k8s/common/agent-studio/google-client-secret
      name: GOOGLE_CLIENT_SECRET
    - key: /k8s/common/agent-studio/llm-api-key
      name: LLM_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-openai-api-key
      name: LLM_PROVIDER_OPENAI_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-anthropic-api-key
      name: LLM_PROVIDER_ANTHROPIC_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-google-api-key
      name: LLM_PROVIDER_GOOGLE_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-xai-api-key
      name: LLM_PROVIDER_XAI_API_KEY
    - key: /k8s/common/agent-studio/llm-provider-openrouter-api-key
      name: LLM_PROVIDER_OPENROUTER_API_KEY
    - key: /k8s/common/agent-studio/aes-encryption-key
      name: AES_ENCRYPTION_KEY
    - key: /k8s/common/agent-studio/a2a-api-key
      name: A2A_API_KEY
    - key: /k8s/common/agent-studio/github-token
      name: GITHUB_TOKEN
    - key: /k8s/common/agent-studio/schedule-scan-token
      name: SCHEDULE_SCAN_TOKEN
    - key: /k8s/k3s-demo/agent-studio/database-url
      name: DATABASE_URL
    - key: /k8s/k3s-demo/agent-studio/minio-root-password
      name: S3_SECRET_ACCESS_KEY




audioWorker:
  enabled: true

workspaceWorker:
  enabled: true
  sandboxImage: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-studio:workspace-v0.113.5
  dockerImage: public.ecr.aws/docker/library/docker:27.5.1-dind
  workerConcurrency: 1
  memoryMb: 1024
  diskMb: 2048
  cpus: 1
  persistence:
    size: 10Gi
    storageClass: local-path
