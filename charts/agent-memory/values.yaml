app:
  fullnameOverride: agent-memory

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/agent-memory
    tag: latest

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      # cpu: 200m
      memory: 512Mi

  service:
    name: http
    targetPort: 3000

  # Draining a pod takes up to the grace period below, so replacing pods one at a
  # time would stretch a rollout to that many multiples. Surging the whole new set
  # at once keeps a rollout to roughly a single drain, at the cost of briefly
  # running double the pods. maxUnavailable stays 0 — capacity never dips.
  controller:
    strategy:
      rollingUpdate:
        maxSurge: 100%
        maxUnavailable: 0

  # Readiness checks PostgreSQL schema and Neo4j connectivity.
  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /api/health
      port: 3000
    initialDelaySeconds: 5
    periodSeconds: 5

  # Dependency outages must remove readiness without restarting every replica.
  livenessProbe:
    tcpSocket:
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10

  startupProbe:
    tcpSocket:
      port: 3000
    periodSeconds: 5
    failureThreshold: 60

  # Leave time for the document worker to release its PostgreSQL queue leases.
  terminationGracePeriodSeconds: 660

  # SIGTERM makes Next.js stop accepting new connections immediately, while
  # removing the pod from Service endpoints propagates asynchronously. Without
  # this pause, requests routed during that window hit a closed listener and fail.
  lifecycle:
    preStop:
      exec:
        command: ["/bin/sh", "-c", "sleep 15"]

  # Memory exports process metrics; Studio active-run metrics do not apply.
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 6
    metrics:
      - type: Resource
        resource:
          name: cpu
          target:
            type: Utilization
            averageUtilization: 70
    behavior:
      scaleUp:
        stabilizationWindowSeconds: 60
        policies:
          - type: Percent
            value: 100
            periodSeconds: 60
      scaleDown:
        stabilizationWindowSeconds: 900
        policies:
          - type: Pods
            value: 1
            periodSeconds: 300

  serviceMonitor:
    # app v1.4.0 drops endpoint authorization; the wrapper owns this monitor.
    enabled: false

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  serviceAccount:
    create: true

  # Keeps replicas off a single node so one node's loss cannot take the service
  # with it — and, with the long grace period, cannot stall every in-flight run.
  podAntiAffinity:
    topologyKey: kubernetes.io/hostname

  # maxUnavailable, not minAvailable: minAvailable equal to minReplicas would
  # leave no disruption budget at the floor and block node drains outright.
  # One pod at a time holds at every fleet size.
  pdb:
    enabled: true
    maxUnavailable: 1

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store

serviceMonitor:
  enabled: true
