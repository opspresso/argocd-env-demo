# Document MCP server Agent Studio calls — reads PDF/DOCX/HWP/HWPX to text,
# writes Markdown out as DOCX/PDF/HWPX and returns a presigned download link.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. Agent Studio
# reaches it at mcp-document.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agent-studio carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one document read or
# one render, so the chart defaults are right.

app:
  fullnameOverride: mcp-document

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-document

  # No MCP_API_KEY, for the same reason url-fetch has none: nothing routes to
  # this Service from outside. The server says which mode it is in on every
  # start, so the day an ingress appears the open mode is in the logs.
  #
  # No AWS credentials either. The ServiceAccount below is bound to
  # pod-role--mcp-document by an EKS Pod Identity association, defined in
  # terraform-env-demo/demo/8-role. Until that role is applied, read_document
  # works and write_document fails with the S3 reason in the tool result.
  configmap:
    enabled: true
    data:
      AWS_REGION: ap-northeast-2
      # Written documents land here under <prefix>/<tenant>/<ulid>/<name>, and
      # the download links this server returns are presigned against the pod
      # role — so the bucket stays private.
      DOCUMENT_BUCKET: agent-studio-document
      DOCUMENT_PREFIX: documents

  service:
    name: http
    targetPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # A document parse holds the whole file in memory, so the limit above is the
  # real bound on a request — not the 20MB fetch cap, which is the input to it.
  # PDF writing adds the two embedded Korean faces (~4MB) on top.

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  # Required, and not just conventional: the Pod Identity association names this
  # account, so the pod gets no AWS credentials at all without it.
  serviceAccount:
    create: true
