# Document MCP server AgentDure calls — reads DOCX/XLSX/PPTX/HWP/HWPX/ODF/RTF
# to text, and writes Markdown out as DOCX/PDF/HWPX, returning the bytes.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. AgentDure
# reaches it at mcp-document.agent-mcps.svc.cluster.local.
#
# Deliberately absent, and not an oversight: the HPA, PDB and long
# terminationGracePeriod that agentdure carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one document read or
# one render, so the chart defaults are right.

app:
  fullnameOverride: mcp-document

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-document

  service:
    name: http
    targetPort: 3000

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # A document parse holds the whole file in memory, so the limit above is the
  # real bound on a request — not the caller's ~11.5MB body cap, which is the
  # input to it. PDF writing adds the two embedded Korean faces (~4MB) on top,
  # and a rendered file rides back through the response, so a render peaks at
  # roughly twice its own size.

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  # Kept, though nothing is bound to it any more: since v0.2.0 the server makes
  # no AWS call, so pod-role--mcp-document and its association can be retired in
  # terraform-env-demo/demo/8-role. The account itself stays because the
  # Deployment names one either way.
  serviceAccount:
    create: true
