app:
  podLabels:
    sidecar.istio.io/inject: "true"

  # No MCP_API_KEY: nothing routes to this Service from outside. The server says
  # which mode it is in on every start, so the day an ingress appears the open
  # mode is in the logs.
  #
  # No configuration at all beyond that, since v0.2.0. The bucket, its prefix,
  # the region and the download TTL left when the renderer stopped storing what
  # it produced — it returns the bytes over MCP now and AgentDure keeps them as
  # an artifact. The pod needs no AWS credentials, so the Pod Identity
  # association and pod-role--mcp-document (terraform-env-demo/demo/8-role) can
  # be retired.