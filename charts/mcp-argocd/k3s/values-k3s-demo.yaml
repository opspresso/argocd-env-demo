app:
  replicaCount: 1
  autoscaling:
    enabled: false

  resources: null



  configmap:
    enabled: true
    data:
      # In-cluster Argo CD. This is mcp-argocd's own outbound call, so Agent
      # Studio's SSRF guard has nothing to say about it — that guard only bounds
      # what Agent Studio itself dials.
      #
      # Plain HTTP, and deliberately: argocd-env-addons runs the server with
      # `server.insecure: true` and terminates TLS at the gateway. Dialing
      # https:// here would only fail a handshake the server does not offer,
      # which is why no NODE_TLS_REJECT_UNAUTHORIZED=0 appears anywhere.
      #
      # The bare origin is right — the client appends /api/v1/... itself.
      ARGOCD_BASE_URL: http://argocd-server.argocd.svc.cluster.local

      # Lists only read tools: create/update/delete/sync_application and
      # run_resource_action are not offered. The token's Argo CD RBAC
      # (`role:mcp` in argocd-env-addons) is the boundary that stops a write.
      MCP_READ_ONLY: "true"