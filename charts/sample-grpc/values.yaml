app:
  fullnameOverride: sample-grpc

  image:
    # repository: 082867736673.dkr.ecr.ap-northeast-2.amazonaws.com/nalbam/sample-grpc
    repository: nalbam/sample-grpc

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

  # The pod runs an injected istio-proxy beside the app, and a type: Resource
  # target sums both containers' CPU and divides by both their requests — the
  # sidecar's idle usage drags the ratio down and hides load on the app.
  # ContainerResource scopes the signal to the app container alone; `app` is
  # the container name the upstream chart's deployment uses.
  autoscaling:
    enabled: true

    minReplicas: 1
    maxReplicas: 6

    behavior:
      scaleDown:
        policies:
        - periodSeconds: 60
          type: Percent
          value: 25
        stabilizationWindowSeconds: 600
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 50

  readinessProbe:
    failureThreshold: 3
    exec:
      command:
        - /bin/grpc_health_probe
        - '-addr=:50051'
    initialDelaySeconds: 1
    periodSeconds: 3
    timeoutSeconds: 3

  livenessProbe:
    failureThreshold: 3
    exec:
      command:
        - /bin/grpc_health_probe
        - '-addr=:50051'
    initialDelaySeconds: 1
    periodSeconds: 3
    timeoutSeconds: 3

  service:
    name: grpc
    targetPort: 50051

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  pdb:
    enabled: true
    maxUnavailable: 1
