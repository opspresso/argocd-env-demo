apiVersion: v2
name: sample-node
description: A Helm chart for Kubernetes
type: application
version: v1.4.0
appVersion: v1.0.0

dependencies:
  - repository: https://opspresso.github.io/helm-charts
    name: app
    version: "v1.3.0"
  - repository: https://charts.bitnami.com/bitnami
    name: redis
    version: "17.0.7"
  - repository: https://charts.helm.sh/incubator
    name: raw
    version: "0.2.5"
    condition: raw.enabled
  # The demo ticker: a CronJob pressing one of the page's two buttons once a
  # minute. Aliased so its values sit under `thumbs:` beside `app:`.
  - repository: https://opspresso.github.io/helm-charts
    name: cronjob
    version: "v1.1.0"
    alias: thumbs
