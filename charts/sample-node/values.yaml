app:
  fullnameOverride: sample-node

  image:
    # repository: 082867736673.dkr.ecr.ap-northeast-2.amazonaws.com/nalbam/sample-node
    repository: nalbam/sample-node

  # controller:
  #   kind: Rollout
  #   strategy:
  #     type: Canary
  #     # rollingUpdate:
  #     #   maxSurge: 25%
  #     #   maxUnavailable: 0
  #     canary:
  #       canaryService: sample-node-preview
  #       stableService: sample-node
  #       trafficRouting:
  #         istio:
  #           virtualService:
  #             name: sample-node
  #             routes:
  #             - primary
  #           destinationRule:
  #             name: sample-node
  #             canarySubsetName: canary
  #             stableSubsetName: stable
  #       steps:
  #       - setWeight: 10
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 25
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 50
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: true

    minReplicas: 1
    maxReplicas: 5

    behavior:
      scaleDown:
        policies:
        - periodSeconds: 60
          type: Percent
          value: 25
        stabilizationWindowSeconds: 600
    # The pod runs an injected istio-proxy beside the app, and a type: Resource
    # target sums both containers' CPU and divides by both their requests — the
    # sidecar's idle usage drags the ratio down and hides load on the app.
    # ContainerResource scopes the signal to the app container alone; `app` is
    # the container name the upstream chart's deployment uses.
    #
    # The target stays at 50, but it now means 50m of the app's own 100m request
    # rather than 50% of the pod's combined request, so it scales out earlier.
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 50

  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /read
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /live
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  service:
    name: http
    targetPort: 3000

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node

  pdb:
    enabled: true
    maxUnavailable: 1

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store

redis:
  fullnameOverride: redis

  image:
    repository: bitnamilegacy/redis

  global:
    storageClass: gp3 # aws-ebs-sc

  # master:
  #   persistence:
  #     existingClaim: sample-redis-master-0
  #     # size: 9Gi

  auth:
    existingSecret: sample-node-external
    existingSecretPasswordKey: REDIS_PASS

  architecture: standalone

# The demo ticker. The index page's two buttons only move the counters while
# someone is clicking them; this CronJob presses one of them every minute so the
# numbers keep moving on their own.
thumbs:
  fullnameOverride: sample-node-thumbs

  schedule: "* * * * *"

  image:
    repository: curlimages/curl
    tag: "8.11.1"

  # The same two calls public/counter.js makes on click: thumbs up is
  # POST /counter/up (INCR), thumbs down is DELETE /counter/down (DECR). awk
  # seeds from the clock, so each tick picks its side independently of the last.
  #
  # No -f and exit 0 whatever happens: the tick only has to place the call. How
  # the app answers is the app's health to report — its probes and alerts
  # already do — and /counter needs Redis, so an unreachable Redis would
  # otherwise file a broken Job every single minute while saying nothing new.
  #
  # Since the Job always succeeds, the tick's outcome lives only in its log:
  # one line per run with the side pressed, the status code (000 when curl
  # never got an answer), how long it took, and curl's own error if any.
  command:
    - /bin/sh
    - -c
    - >-
      if [ "$(awk 'BEGIN{srand();print int(rand()*2)}')" = 0 ];
      then SIDE=up; else SIDE=down; fi;
      curl -s -o /dev/null
      -w "thumbs $SIDE %{http_code} %{time_total}s %{errormsg}\n"
      -X POST http://sample-node/counter/$SIDE;
      exit 0

  # A tick answers in milliseconds; one that outlives the next tick is stuck.
  activeDeadlineSeconds: 55
  concurrencyPolicy: Forbid
  backoffLimit: 0
  restartPolicy: Never
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 600

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

raw:
  enabled: false

  resources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          app.kubernetes.io/component: master
          app.kubernetes.io/instance: sample-node-eks-demo
          app.kubernetes.io/name: redis
        name: sample-redis-master-0
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: gp3 # aws-ebs-sc
        volumeMode: Filesystem
        volumeName: pvc-5d0eeea7-3f8f-406e-ab7d-c114a7bcc81a
