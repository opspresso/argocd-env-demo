app:
  fullnameOverride: sample-node

  image:
    # repository: 082867736673.dkr.ecr.ap-northeast-2.amazonaws.com/nalbam/sample-node
    repository: nalbam/sample-node

  # controller:
  #   kind: Rollout
  #   strategy:
  #     type: Canary
  #     # rollingUpdate:
  #     #   maxSurge: 25%
  #     #   maxUnavailable: 0
  #     canary:
  #       canaryService: sample-node-preview
  #       stableService: sample-node
  #       trafficRouting:
  #         istio:
  #           virtualService:
  #             name: sample-node
  #             routes:
  #             - primary
  #           destinationRule:
  #             name: sample-node
  #             canarySubsetName: canary
  #             stableSubsetName: stable
  #       steps:
  #       - setWeight: 10
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 25
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 50
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 256Mi

  autoscaling:
    enabled: true

    minReplicas: 1
    maxReplicas: 6

    behavior:
      scaleDown:
        policies:
        - periodSeconds: 60
          type: Percent
          value: 25
        stabilizationWindowSeconds: 600
    # The pod runs an injected istio-proxy beside the app, and a type: Resource
    # target sums both containers' CPU and divides by both their requests — the
    # sidecar's idle usage drags the ratio down and hides load on the app.
    # ContainerResource scopes the signal to the app container alone; `app` is
    # the container name the upstream chart's deployment uses.
    #
    # The target stays at 50, but it now means 50m of the app's own 100m request
    # rather than 50% of the pod's combined request, so it scales out earlier.
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 50

  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /read
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /live
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  service:
    name: http
    targetPort: 3000

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node

  pdb:
    enabled: true
    maxUnavailable: 1

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store

  workloads:
    thumbs:
      enabled: true
      fullnameOverride: sample-node-thumbs
      containerName: ticker
      controller:
        strategy:
          type: Recreate
      service:
        enabled: false
      image:
        repository: curlimages/curl
        tag: 8.11.1
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      podAnnotations:
        sidecar.istio.io/inject: 'false'
      command:
      - /bin/sh
      - -c
      - |
        set -u
        trap 'exit 0' INT TERM
        while true; do
          started=$(date +%s)
          seq 45 | awk -v url="$COUNTER_URL" 'BEGIN{srand()}{print "-o"; print "/dev/null"; print url (rand() < 0.5 ? "up" : "down")}' \
            | xargs timeout 50 curl -sS --connect-timeout 5 --max-time 10 --rate 1/s -X POST -w "%{http_code}\n" \
            | awk '{c[$0]++} END{line="thumbs"; for (k in c) line=line " " k "x" c[k]; print line}'
          delay=$((60 - ($(date +%s) - started)))
          [ "$delay" -gt 0 ] || delay=1
          sleep "$delay" &
          wait "$!"
        done
      env:
      - name: COUNTER_URL
        value: http://sample-node/counter/
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi
      overrides: |
        {{- if not .Values.resources }}
        resources: null
        {{- end }}

redis:
  fullnameOverride: redis

  image:
    repository: bitnamilegacy/redis

  global:
    storageClass: gp3 # aws-ebs-sc

  # master:
  #   persistence:
  #     existingClaim: sample-redis-master-0
  #     # size: 9Gi

  auth:
    existingSecret: sample-node-external
    existingSecretPasswordKey: REDIS_PASS

  architecture: standalone


raw:
  enabled: false

  resources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          app.kubernetes.io/component: master
          app.kubernetes.io/instance: sample-node-eks-demo
          app.kubernetes.io/name: redis
        name: sample-redis-master-0
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: gp3 # aws-ebs-sc
        volumeMode: Filesystem
        volumeName: pvc-5d0eeea7-3f8f-406e-ab7d-c114a7bcc81a
