app:
  fullnameOverride: sample-node

  image:
    # repository: 082867736673.dkr.ecr.ap-northeast-2.amazonaws.com/nalbam/sample-node
    repository: nalbam/sample-node

  # controller:
  #   kind: Rollout
  #   strategy:
  #     type: Canary
  #     # rollingUpdate:
  #     #   maxSurge: 25%
  #     #   maxUnavailable: 0
  #     canary:
  #       canaryService: sample-node-preview
  #       stableService: sample-node
  #       trafficRouting:
  #         istio:
  #           virtualService:
  #             name: sample-node
  #             routes:
  #             - primary
  #           destinationRule:
  #             name: sample-node
  #             canarySubsetName: canary
  #             stableSubsetName: stable
  #       steps:
  #       - setWeight: 10
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 25
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark
  #       - setWeight: 50
  #       - pause:
  #           duration: 10
  #       - analysis:
  #           args:
  #           - name: url
  #             value: http://sample-node-preview/success/98
  #           templates:
  #           - clusterScope: true
  #             templateName: http-benchmark

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 100m
      memory: 128Mi

  autoscaling:
    enabled: true

    minReplicas: 1
    maxReplicas: 6

    behavior:
      scaleDown:
        policies:
        - periodSeconds: 60
          type: Percent
          value: 25
        stabilizationWindowSeconds: 600
    # The pod runs an injected istio-proxy beside the app, and a type: Resource
    # target sums both containers' CPU and divides by both their requests — the
    # sidecar's idle usage drags the ratio down and hides load on the app.
    # ContainerResource scopes the signal to the app container alone; `app` is
    # the container name the upstream chart's deployment uses.
    #
    # The target stays at 50, but it now means 50m of the app's own 100m request
    # rather than 50% of the pod's combined request, so it scales out earlier.
    metrics:
    - type: ContainerResource
      containerResource:
        name: cpu
        container: app
        target:
          type: Utilization
          averageUtilization: 50

  readinessProbe:
    failureThreshold: 3
    httpGet:
      path: /read
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  livenessProbe:
    failureThreshold: 3
    httpGet:
      path: /live
      port: 3000
    initialDelaySeconds: 1
    periodSeconds: 3

  service:
    name: http
    targetPort: 3000

  routing:
    httpRoute:
      parentRefs:
        - name: istio-ingressgateway
          namespace: istio-system

  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: topology.kubernetes.io/zone
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node
    - maxSkew: 1
      topologyKey: kubernetes.io/hostname
      whenUnsatisfiable: ScheduleAnyway
      labelSelector:
        matchLabels:
          app: sample-node

  pdb:
    enabled: true
    maxUnavailable: 1

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store

redis:
  fullnameOverride: redis

  image:
    repository: bitnamilegacy/redis

  global:
    storageClass: gp3 # aws-ebs-sc

  # master:
  #   persistence:
  #     existingClaim: sample-redis-master-0
  #     # size: 9Gi

  auth:
    existingSecret: sample-node-external
    existingSecretPasswordKey: REDIS_PASS

  architecture: standalone

# The demo ticker. The index page's two buttons only move the counters while
# someone is clicking them; this CronJob presses them on its own so the numbers
# keep moving. At three presses a second it doubles as the traffic the
# dashboards graph — nothing else calls this cluster between demos, and one
# call a minute sat too close to zero on a rate graph to read.
thumbs:
  fullnameOverride: sample-node-thumbs

  schedule: "* * * * *"

  image:
    repository: curlimages/curl
    tag: "8.11.1"

  # The call public/counter.js makes on click, POST /counter/<side>, 150 times
  # at three a second — fifty seconds of the minute — with awk picking a side
  # per press the way a visitor would.
  #
  # One curl rather than a loop of them: a process and a TLS handshake per
  # request would cost more CPU than this job is allowed, while a single
  # connection carries all 150 on keep-alive. --rate is what paces them; curl
  # given a list of URLs otherwise sends them as fast as it can.
  #
  # No -f and exit 0 whatever happens: the tick only has to place the calls. How
  # the app answers is the app's health to report — its probes and alerts
  # already do — and /counter needs Redis, so an unreachable Redis would
  # otherwise file a broken Job every single minute while saying nothing new.
  #
  # Since the Job always succeeds, the tick's outcome lives only in its log, and
  # 150 lines a minute would bury it. The codes are tallied into one line per
  # tick instead — `thumbs 200x150`, with 000 for calls that got no answer.
  command:
    - /bin/sh
    - -c
    - >-
      seq 150 | awk 'BEGIN{srand()}{print "-o"; print "/dev/null";
      print "http://sample-node/counter/" (rand() < 0.5 ? "up" : "down")}'
      | xargs curl -s --rate 3/s -X POST -w "%{http_code}\n"
      | awk '{c[$0]++} END{line="thumbs"; for (k in c) line=line " " k "x" c[k]; print line}';
      exit 0

  # The tick now runs most of the minute by design, so the deadline is only here
  # to stop one that has stalled from overlapping the next.
  activeDeadlineSeconds: 55
  concurrencyPolicy: Forbid
  backoffLimit: 0
  restartPolicy: Never
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  ttlSecondsAfterFinished: 600

  resources:
    requests:
      cpu: 10m
      memory: 16Mi
    limits:
      cpu: 50m
      memory: 32Mi

raw:
  enabled: false

  resources:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        labels:
          app.kubernetes.io/component: master
          app.kubernetes.io/instance: sample-node-eks-demo
          app.kubernetes.io/name: redis
        name: sample-redis-master-0
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
        storageClassName: gp3 # aws-ebs-sc
        volumeMode: Filesystem
        volumeName: pvc-5d0eeea7-3f8f-406e-ab7d-c114a7bcc81a
