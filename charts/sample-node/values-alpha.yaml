app:
  autoscaling:
    enabled: true
    maxReplicas: 6
    minReplicas: 2
  configmap:
    data:
      VERSION: v0.16.16
    enabled: true
  env:
  - name: ENV_HASH
    value: ceaea5ba2ed2c5184e28126dd055a6c4
  - name: VERSION
    value: v0.16.16
  externalSecrets:
    data:
    - key: /k8s/common/slack-token
      name: slack-token
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS
    enabled: true
  image:
    tag: v0.16.16
