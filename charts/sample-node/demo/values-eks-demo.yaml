app:
  configmap:
    data:
      CLUSTER_NAME: 'eks-demo'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'demo'
      PROTOCOL: http
      REDIS_HOST: redis-master
      REDIS_PORT: '6379'
  routing:
    hosts:
    - sample-node.demo.opspresso.com
    httpRoute:
      enabled: true
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.opspresso.com
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  externalSecrets:
    data:
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS

redis:
  istio:
    sidecar:
      inject: true

thumbs:
  command:
    - /bin/sh
    - -c
    - >-
      if [ "$(awk 'BEGIN{srand();print int(rand()*2)}')" = 0 ];
      then curl -s -o /dev/null -X POST http://sample-node.demo.opspresso.com/counter/up;
      else curl -s -o /dev/null -X POST http://sample-node.demo.opspresso.com/counter/down;
      fi; exit 0