app:
  configmap:
    data:
      CLUSTER_NAME: 'eks-demo-b'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'demo'
      PROTOCOL: http
      REDIS_HOST: redis-master
      REDIS_PORT: '6379'
  routing:
    hosts:
    - sample-node.demo.opspresso.com
    httpRoute:
      enabled: true
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.opspresso.com
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  externalSecrets:
    data:
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS

redis:
  istio:
    sidecar:
      inject: true

# https rather than http: the ALB in front of the gateway answers http with a 301
# to https, and this curl has no -L, so every tick stopped at the redirect. The
# app never saw the POST and neither did the mesh metrics.
thumbs:
  command:
    - /bin/sh
    - -c
    - >-
      seq 150 | awk 'BEGIN{srand()}{print "-o"; print "/dev/null";
      print "https://sample-node.demo.opspresso.com/counter/" (rand() < 0.5 ? "up" : "down")}'
      | xargs curl -s --rate 3/s -X POST -w "%{http_code}\n"
      | awk '{c[$0]++} END{line="thumbs"; for (k in c) line=line " " k "x" c[k]; print line}';
      exit 0