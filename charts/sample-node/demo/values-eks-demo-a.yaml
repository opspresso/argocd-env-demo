app:
  configmap:
    data:
      CLUSTER_NAME: 'eks-demo-a'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'demo'
      PROTOCOL: http
      REDIS_HOST: redis-master
      REDIS_PORT: '6379'
  routing:
    hosts:
    - sample-node.demo.opspresso.com
    httpRoute:
      enabled: true
  podLabels:
    sidecar.istio.io/inject: "true"
  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.opspresso.com
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo
  externalSecrets:
    data:
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS

redis:
  istio:
    sidecar:
      inject: true

# https rather than http: the ALB in front of the gateway answers http with a 301
# to https, and this curl has no -L, so every tick stopped at the redirect. The
# app never saw the POST and neither did the mesh metrics.
thumbs:
  command:
    - /bin/sh
    - -c
    - >-
      if [ "$(awk 'BEGIN{srand();print int(rand()*2)}')" = 0 ];
      then SIDE=up; else SIDE=down; fi;
      curl -s -o /dev/null
      -w "thumbs $SIDE %{http_code} %{time_total}s %{errormsg}\n"
      -X POST https://sample-node.demo.opspresso.com/counter/$SIDE;
      exit 0