app:
  replicaCount: 1
  autoscaling:
    enabled: True

  configmap:
    data:
      CLUSTER_NAME: 'eks-demo-a'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'eks'
      PROTOCOL: http
      REDIS_HOST: redis-master
      REDIS_PORT: '6379'
  routing:
    hosts:
    - sample-node.demo.opspresso.com
    httpRoute:
      enabled: true


  podLabels:
    sidecar.istio.io/inject: "true"

  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.opspresso.com
  serviceMonitor:
    enabled: true
    labels:
      release: prometheus-eks-demo-a
  externalSecrets:
    data:
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS

  workloads:
    thumbs:
      env:
        - name: COUNTER_URL
          value: https://sample-node.demo.opspresso.com/counter/

redis:
  istio:
    sidecar:
      inject: true
