app:
  replicaCount: 1
  autoscaling:
    enabled: False

  resources: null

  configmap:
    data:
      CLUSTER_NAME: 'k3s-demo'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'k3s'
      PROTOCOL: http
      REDIS_HOST: redis-master
      REDIS_PORT: '6379'
  routing:
    hosts:
    - sample-node.demo.opsp.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.opsp.dev
  serviceMonitor:
    enabled: true
    labels:
      release: victoria-metrics-k3s-demo
  externalSecrets:
    data:
    - key: /k8s/common/sample-node/redis-password
      name: REDIS_PASS

redis:
  istio:
    sidecar:
      inject: true

  resources: null


# https rather than http: the ALB in front of the gateway answers http with a 301
# to https, and this curl has no -L, so every tick stopped at the redirect. The
# app never saw the POST and neither did the mesh metrics.
thumbs:

  resources: null

  command:
    - /bin/sh
    - -c
    - >-
      seq 45 | awk 'BEGIN{srand()}{print "-o"; print "/dev/null";
      print "https://sample-node.demo.opsp.dev/counter/" (rand() < 0.5 ? "up" : "down")}'
      | xargs timeout 50 curl -s --rate 1/s -X POST -w "%{http_code}\n"
      | awk '{c[$0]++} END{line="thumbs"; for (k in c) line=line " " k "x" c[k]; print line}';
      exit 0