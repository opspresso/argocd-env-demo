app:
  replicaCount: 1
  autoscaling:
    enabled: False

  resources: null

  configmap:
    data:
      CLUSTER_NAME: 'k3s-demo'
      HOSTNAME: sample.svc.cluster.local
      MESSAGE: hello world
      PROFILE: 'k3s'
      PROTOCOL: http
      REDIS_ENABLED: 'false'

  routing:
    hosts:
    - sample-node.demo.opsp.dev
    httpRoute:
      enabled: true

      parentRefs:
        - name: traefik-gateway
          namespace: traefik-gateway


  podAnnotations:
    link.argocd.argoproj.io/external-link: https://sample-node.demo.opsp.dev
  serviceMonitor:
    enabled: false
    labels:
      release: prometheus-k3s-demo
  externalSecrets:
    enabled: false

    data: []


  workloads:
    thumbs:
      enabled: false
      env:
        - name: COUNTER_URL
          value: https://sample-node.demo.opsp.dev/counter/

redis:
  enabled: false
  istio:
    sidecar:
      inject: true

  resources: null
  master:
    resources: null
