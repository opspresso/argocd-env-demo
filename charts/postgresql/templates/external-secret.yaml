{{- if .Values.externalSecrets.enabled }}
{{- $ssmPrefix := required "ssmPrefix is required; include <platform>/values-<cluster>.yaml" .Values.ssmPrefix -}}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgresql-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  target:
    name: postgresql-credentials
    creationPolicy: Owner
  data:
    - secretKey: postgres-password
      remoteRef:
        key: {{ $ssmPrefix }}/agent-studio/postgres-password
    - secretKey: password
      remoteRef:
        key: {{ $ssmPrefix }}/agent-studio/postgres-password
{{- end }}
