# YouTube transcript/metadata MCP server AgentDure calls.
#
# Cluster-internal by design: no `routing` block anywhere in this chart, so no
# HTTPRoute is ever rendered and the only way in is the ClusterIP. AgentDure
# reaches it at mcp-youtube.agent-mcps.svc.cluster.local.
#
# Deliberately absent, like its siblings: the HPA, PDB and long
# terminationGracePeriod that agentdure carries. Those exist for ten-minute
# runs holding in-flight SSE streams. A request here is one innertube call plus
# one caption fetch, so the chart defaults are right.

app:
  fullnameOverride: mcp-youtube

  image:
    repository: 396608815058.dkr.ecr.ap-northeast-2.amazonaws.com/mcp-youtube

  service:
    name: http
    targetPort: 3000

  # A transcript is bounded at 90k characters by the server itself, so the
  # working set per request is small; these are its siblings' numbers.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  readinessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

  livenessProbe:
    httpGet:
      path: /health
      port: 3000
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3

  serviceAccount:
    create: true
