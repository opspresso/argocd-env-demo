externalSecrets:
  enabled: true

neo4jdb:
  fullnameOverride: memory-neo4j
  disableLookups: true

  neo4j:
    name: memory-neo4j
    edition: community
    passwordFromSecret: memory-neo4j-auth

  volumes:
    data:
      mode: defaultStorageClass
      defaultStorageClass:
        accessModes:
        - ReadWriteOnce
        requests:
          storage: 5Gi

  # Agent Memory connects through the in-cluster Service. The upstream chart
  # enables a LoadBalancer for Neo4j Browser/Bolt by default, which would
  # expose the database on a k3s node even though IDC keeps both ports private.
  services:
    neo4j:
      enabled: false

raw:
  templates:
    - |
        {{- $ssmPrefix := required "ssmPrefix is required; include <platform>/values-<cluster>.yaml" .Values.global.ssmPrefix -}}
        apiVersion: external-secrets.io/v1
        kind: ExternalSecret
        metadata:
          name: memory-neo4j-auth
          annotations:
            argocd.argoproj.io/sync-wave: "-1"
        spec:
          refreshInterval: 1h
          secretStoreRef:
            kind: ClusterSecretStore
            name: parameter-store
          target:
            name: memory-neo4j-auth
            creationPolicy: Owner
          data:
            - secretKey: NEO4J_AUTH
              remoteRef:
                key: {{ $ssmPrefix }}/agent-memory/neo4j-auth
