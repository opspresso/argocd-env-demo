apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: memory-neo4j-auth
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: parameter-store
  target:
    name: memory-neo4j-auth
    creationPolicy: Owner
  data:
    - secretKey: NEO4J_AUTH
      remoteRef:
        key: /k8s/k3s-demo/agent-memory/neo4j-auth
