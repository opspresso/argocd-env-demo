# Image tag, pinned by hand.
#
# agent-studio's equivalent file is generated — its release workflow sends a
# repository_dispatch that gen_values.py turns into a bump. No MCP server does
# that, so this moves when someone edits it, which is also why it is pinned
# rather than :latest.

app:
  image:
    # Upstream tags carry no `v` prefix, unlike everything else in this repo.
    tag: "1.0.0"

  externalSecrets:
    enabled: true
    refreshInterval: 1h
    secretStoreRef:
      kind: ClusterSecretStore
      name: parameter-store
    data:
      # Basic auth with the same parameters that seed Grafana's own
      # GF_SECURITY_ADMIN_* env, not a service account token. A token lives in
      # Grafana's database and dies whenever the PVC is recreated with the
      # cluster; the admin credential is re-seeded from these parameters on
      # every fresh start, so both sides always agree.
      - key: /k8s/common/admin-user
        name: GRAFANA_USERNAME
      - key: /k8s/common/admin-password
        name: GRAFANA_PASSWORD
