apiVersion: batch/v1
kind: CronJob
metadata:
  name: agent-studio-reindex
  labels:
    app: "agent-studio-reindex"
    app.kubernetes.io/name: "agent-studio-reindex"
    app.kubernetes.io/instance: "agent-studio"
    app.kubernetes.io/version: "8.11.1"
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: reindex-v1.1.0
spec:
  schedule: "12 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      activeDeadlineSeconds: 60
      backoffLimit: 0
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app: "agent-studio-reindex"
            version: "8.11.1"
            app.kubernetes.io/name: "agent-studio-reindex"
            app.kubernetes.io/instance: "agent-studio"
            app.kubernetes.io/version: "8.11.1"
        spec:
          containers:
            - name: job
              image: curlimages/curl:8.11.1
              command:
                - /bin/sh
                - -c
                - 'curl -sf -X POST -H "x-scan-token: ${SCHEDULE_SCAN_TOKEN}" http://agent-studio/api/catalog/reindex'
              resources:
                limits:
                  cpu: 50m
                  memory: 32Mi
                requests:
                  cpu: 10m
                  memory: 16Mi
              envFrom:
                - secretRef:
                    name: agent-studio-external
          serviceAccountName: default
          restartPolicy: Never

